name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      # Offline tests only — tests/integration/ is auto-skipped unless RUN_INTEGRATION=1 and a
      # live Lakebase is configured (see tests/conftest.py), so no Databricks credentials are
      # needed here. The dummy Lakebase env vars below only satisfy config validation at import
      # time (agent_server/agent.py); no connection is attempted.
      - name: Test (pytest)
        env:
          LAKEBASE_AUTOSCALING_PROJECT: ci-placeholder
          LAKEBASE_AUTOSCALING_BRANCH: ci-placeholder
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runs `tsc --noEmit && vite build` — typechecks and builds the SPA.
      - name: Build
        run: npm run build
