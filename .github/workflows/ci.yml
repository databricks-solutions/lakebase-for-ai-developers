name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # allow manual runs from the Actions tab

# Least privilege: CI only needs to read the repo. Override per-job if a step ever needs more.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. new push to a PR branch) so stale runs don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      # Offline tests only — tests/integration/ is auto-skipped unless RUN_INTEGRATION=1 and a
      # live Lakebase is configured (see tests/conftest.py), so no Databricks credentials are
      # needed here. The dummy Lakebase env vars below only satisfy config validation at import
      # time (agent_server/agent.py); no connection is attempted.
      - name: Test (pytest)
        env:
          LAKEBASE_AUTOSCALING_PROJECT: ci-placeholder
          LAKEBASE_AUTOSCALING_BRANCH: ci-placeholder
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runs `tsc --noEmit && vite build` — typechecks and builds the SPA.
      - name: Build
        run: npm run build
