# Databricks Asset Bundle (DABs) — Supply-Chain Planner Copilot.
#
# ONE-SHOT DEPLOY. A field SA points a CLI profile at their own workspace, sets a couple of
# variables (catalog + Lakebase project), and gets the whole demo: the App (LangGraph agent +
# chat UI served at /ui), a fresh MLflow experiment for tracing, and a setup-and-seed job that
# loads the demo dataset (operational tables + pgvector + Genie + Knowledge/Vector-Search).
#
#   # 0. one-time prereqs (see docs/DEPLOY.md): a Lakebase autoscaling project + a catalog you
#   #    can write to. The deployer should be a workspace admin.
#   # 1. build the SPA + deploy the bundle + (optionally) seed demo data — all in one wrapper:
#   make deploy PROFILE=<your-cli-profile>                 # demo data on by default
#   make deploy PROFILE=<your-cli-profile> SEED=false      # bring your own data (skip seeding)
#
# Equivalent raw commands:
#   npm --prefix frontend ci && npm --prefix frontend run build
#   databricks bundle deploy -t dev --profile <p>
#   databricks bundle run setup_and_seed -t dev --profile <p>   # only if seeding demo data
#
# DATA TOGGLE: start on the bundled demo samples (run the seed job). Later, point `uc_catalog` /
# `uc_schema` at your own governed tables and DON'T run the seed job — the app reads whatever the
# variables point at. The Genie (Analytics) space is now a first-class DABs resource
# (resources.genie_spaces below) — created + bound to the app on `bundle deploy`, no seed-then-patch.

bundle:
  name: supply_chain_planner
  # Genie spaces are a first-class DABs resource (resources.genie_spaces) only under the DIRECT
  # deployment engine, added in Databricks CLI 1.3.0 (direct is the default since 1.3.0). Pin both so
  # a too-old CLI fails fast at `bundle validate` instead of silently dropping the resource. Migrating
  # an existing Terraform-engine deploy: `databricks bundle deployment migrate -t <target>` adopts
  # resources in place — verify `bundle plan` shows no destructive actions first. See docs/DEPLOY.md.
  databricks_cli_version: ">= 1.3.0"
  engine: direct

# The built SPA lives in frontend/dist (git-ignored). Force-include it so `bundle deploy` ships it
# to the App even though .gitignore would otherwise exclude it. Build it first (the Makefile does).
sync:
  include:
    - frontend/dist/**
  exclude:
    # Local-only input for the genie_spaces resource (file_path). `bundle deploy` reads it from disk
    # to build the space; it must NOT be synced into the app's source snapshot — the Workspace import
    # rejects the .geniespace.json node type ("node type UNKNOWN"), which fails `bundle run` on the app.
    - data/genie/supply_chain.geniespace.json

variables:
  # --- App ---
  # The Databricks App name. Single source of truth — drives both the app resource's `name` and the
  # seed job's APP_NAME (so the grant_app_sp task resolves the app's SP). Rename in one place.
  app_name:
    description: Name of the deployed Databricks App.
    default: supply-chain-planner

  # --- Unity Catalog: the Genie/operational Delta source + the Knowledge volume & VS index. ---
  uc_catalog:
    description: Catalog holding the operational Delta tables, Knowledge volume, VS index, and trace schema. Must already exist and be writable by the deployer.
    default: serverless_stable_yau46e_catalog
  uc_schema:
    description: Schema (within uc_catalog) for the operational Delta tables + Knowledge corpus.
    default: planner

  # --- Lakebase autoscaling (the agent's durable state + operational hybrid query). ---
  # Assumed to already exist (see docs/DEPLOY.md). The App mints OAuth DB creds from these coords.
  lakebase_project:
    description: Lakebase autoscaling project id (e.g. mfg-supply-chain-copilot).
    default: mfg-supply-chain-copilot
  lakebase_branch:
    description: Lakebase branch.
    default: production
  lakebase_endpoint:
    description: Lakebase endpoint name on the branch.
    default: primary
  lakebase_database:
    description: Lakebase Postgres database.
    default: databricks_postgres
  lakebase_database_resource:
    description: "Internal Lakebase database resource name for the `postgres` app resource — deterministic kebab-case of `lakebase_database`; verify with `databricks api get /api/2.0/postgres/projects/<p>/branches/<b>/databases`."
    default: databricks-postgres
  # NOTE: the operational synced tables live in uc_catalog (schema `public`), NOT a separate
  # Lakebase-registered catalog — the synced-table spec carries its own branch + postgres_database,
  # so a plain writable catalog works and the bundle creates the `public` schema in it. One catalog
  # var to set (uc_catalog); LAKEBASE_UC_CATALOG below follows it.

  # --- Analytics (Genie) — created + bound declaratively via resources.genie_spaces below. ---
  # No genie_space_id var: DABs creates the space (from data/genie/supply_chain.geniespace.json) and
  # the app reads its id back via ${resources.genie_spaces.supply_chain_analytics.space_id} — no
  # hardcoded id, no capture-and-patch step. BYO an existing space with `databricks bundle generate
  # genie-space --existing-id <id>` (emits the resource YAML + .geniespace.json to commit).
  genie_space_name:
    description: Genie space display name (resource title + the genie-space app-resource label).
    default: "Supply-Chain Planner — Analytics"
  genie_consumer_group:
    # Workspace group granted CAN_RUN on the space (OBO consumers) via the genie_spaces.permissions
    # block below. Defaults to `users` (a real, always-present group, like the canonical DABs example)
    # so the declarative grant is always valid. Scope tighter with --var genie_consumer_group=<group>
    # (or deploy.sh --genie-consumer-group <group>). The app SP also gets CAN_RUN via the app binding.
    description: Workspace group granted CAN_RUN on the Genie space (OBO consumers). Default `users`.
    default: "users"

  # --- Knowledge (Mosaic AI Vector Search). ---
  vector_search_endpoint:
    description: Vector Search endpoint name (created by the seed job's build_vs_index task).
    default: supply-chain-planner-vs
  embedding_endpoint:
    description: Databricks embedding endpoint for the store + VS index.
    default: databricks-gte-large-en

  # --- Inference. Two LLM callsites: a fast router (classifier) + the planner (synthesis). The
  # gather/retrieval agents use Vector Search / Genie / Lakebase, not an LLM endpoint. ---
  llm_router_endpoint:
    description: Fast model for the supervisor/router (a constrained classifier — small is plenty).
    default: databricks-claude-haiku-4-5
  llm_endpoint:
    description: Foundation Model endpoint for the planner (complex synthesis).
    default: databricks-claude-opus-4-8

  # --- MLflow 3 Unity-Catalog tracing (telemetry written by the App service principal). ---
  mlflow_trace_schema:
    description: Schema (within uc_catalog) where MLflow writes UC-backed traces. Created by the bootstrap_schemas task.
    default: mlflow_traces
  mlflow_trace_prefix:
    description: Table-name prefix for the UC trace tables.
    default: scp
  # SQL warehouse that backs UC trace storage (and the seed's Genie/knowledge SQL). Defaults to the
  # bundle-created `app_sql_warehouse` resource below — no hardcoded id, and the app binds it so the
  # App SP auto-gets CAN_USE. BYO: pass --var sql_warehouse_id=<existing id> to use a governed/existing
  # warehouse instead. (A deployer who cannot create warehouses at all is the documented byo/Tier-2
  # case — not handled here; this always creates its own, which auto-stops at ~zero idle cost.)
  sql_warehouse_id:
    description: Warehouse for MLflow UC tracing + seed SQL. Defaults to the bundle-created serverless warehouse; override with an existing warehouse id to BYO.
    default: ${resources.sql_warehouses.app_sql_warehouse.id}

  log_level:
    description: App log level.
    default: INFO

resources:
  # Bundle-created SQL warehouse backing MLflow UC trace storage (and, via &seed_cfg, the seed's
  # Genie-space + knowledge SQL). Small + serverless + short auto-stop → ~zero idle cost. The app
  # binds it (app `resources` below) so the App SP auto-gets CAN_USE and the id is injected into the
  # env via value_from — no hardcoded warehouse id. `var.sql_warehouse_id` defaults to this; pass
  # --var sql_warehouse_id=<existing id> to BYO a governed/existing warehouse instead.
  sql_warehouses:
    app_sql_warehouse:
      name: ${bundle.name}-${bundle.target}-wh
      cluster_size: "2X-Small"          # smallest; trace writes are tiny (the old shared wh was Small)
      enable_serverless_compute: true   # serverless + PRO, like the prior "Serverless Starter Warehouse"
      warehouse_type: PRO
      auto_stop_mins: 10
      min_num_clusters: 1
      max_num_clusters: 1
      tags:
        custom_tags:
          - key: app
            value: ${bundle.name}
          - key: target
            value: ${bundle.target}
          - key: purpose
            value: mlflow-uc-tracing
          - key: managed-by
            value: dabs

  # Bundle-managed MLflow experiment — DABs creates a FRESH one per deploy, owned by the deployer.
  # Fresh matters: MLflow's UC trace destination only binds to a trace-free experiment. The App
  # binds to it by id (env MLFLOW_EXPERIMENT_ID, value_from "experiment"), and the experiment
  # app-resource below grants the App's service principal CAN_MANAGE so it can write traces.
  # Bumping the resource KEY (not just `name:`) is what forces DABs to provision a brand-new,
  # trace-free experiment — MLflow's UC trace destination only binds to an experiment with no
  # existing traces. Renaming via `name:` alone keeps the same experiment_id (DABs tracks by key),
  # so it stays full of the old artifact-storage traces and the UC bind fails. Bump the key on the
  # rare occasion you must re-home tracing onto UC; the old experiment is destroyed on deploy.
  experiments:
    planner_experiment_uc:
      name: /Users/${workspace.current_user.userName}/${bundle.name}-${bundle.target}-uc-traces

  # Bundle-created Genie space (Analytics agent). DABs creates it from the serialized definition in
  # data/genie/supply_chain.geniespace.json — generated from data/genie/genie_config.py (the single
  # source of truth) by scripts/deploy.sh before `bundle deploy`, so the baked-in fully-qualified
  # table identifiers match the target's uc_catalog/uc_schema. The app binds it by id (the genie-space
  # app resource below, value_from "genie-space"); the permissions grant lets OBO consumers query it.
  # Requires the DIRECT engine + CLI >= 1.3.0 (see the bundle: block above).
  genie_spaces:
    supply_chain_analytics:
      title: ${var.genie_space_name}
      description: "Aggregation + reporting over governed supply-chain tables for the Planner Copilot. Use for unfulfilled-demand rollups, supplier-risk summaries, and on-hand vs open-PO comparisons."
      warehouse_id: ${var.sql_warehouse_id}
      # Opaque JSON — DABs does NOT substitute ${var...} inside it, so the fully-qualified table
      # identifiers (uc_catalog.uc_schema.<table>) are baked in at generation time. Regenerate with
      # `uv run python data/genie/build_geniespace_json.py` (deploy.sh runs this before bundle deploy).
      file_path: ./data/genie/supply_chain.geniespace.json
      permissions:
        - level: CAN_RUN
          group_name: ${var.genie_consumer_group}

  apps:
    supply_chain_planner:
      name: ${var.app_name}
      description: "Multi-agent supply-chain planner copilot — LangGraph on Apps, Lakebase state, OBO, MLflow tracing, chat UI at /ui"
      source_code_path: ./

      # OBO (on-behalf-of-user): the App requests these user scopes so Knowledge (Vector Search),
      # Analytics (Genie), and UC reads run as the signed-in planner — least privilege, no broad
      # grants on the App service principal for data access. (Tracing is App-SP telemetry, granted
      # via the experiment resource below.)
      user_api_scopes:
        - sql
        - vectorsearch.vector-search-indexes
        - dashboards.genie
        - serving.serving-endpoints
        - catalog.tables:read
        - catalog.schemas:read
        - catalog.catalogs:read

      config:
        command: ["uv", "run", "start-server"]
        env:
          # --- MLflow tracing ---
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: MLFLOW_TRACE_CATALOG
            value: ${var.uc_catalog}
          - name: MLFLOW_TRACE_SCHEMA
            value: ${var.mlflow_trace_schema}
          - name: MLFLOW_TRACE_TABLE_PREFIX
            value: ${var.mlflow_trace_prefix}
          - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID
            # Injected from the `trace-warehouse` app resource below (the bound warehouse's id); the
            # binding also auto-grants the App SP CAN_USE on it. No hardcoded id / no env literal.
            value_from: "trace-warehouse"

          # --- Lakebase (autoscaling) — app SP mints OAuth DB creds from these coords ---
          - name: LAKEBASE_AUTOSCALING_PROJECT
            value: ${var.lakebase_project}
          - name: LAKEBASE_AUTOSCALING_BRANCH
            value: ${var.lakebase_branch}
          - name: LAKEBASE_AUTOSCALING_ENDPOINT
            value: ${var.lakebase_endpoint}
          - name: LAKEBASE_DATABASE
            value: ${var.lakebase_database}
          - name: LAKEBASE_AGENT_MEMORY_SCHEMA
            # The app SP creates + OWNS this schema at startup (it has CREATE on the DB via the
            # postgres resource). It must be a name no prior/defunct SP already owns — a schema owned
            # by an old SP (e.g. after an app delete+recreate) can't be written by the new SP and the
            # checkpointer falls through to `public` → "permission denied for schema public" crash.
            # See docs/lakebase-apps-permissions.md (SP-recreate orphaned-schema lifecycle).
            value: "supply_chain_planner_memory"
          - name: LAKEBASE_WRITEBACK_SCHEMA
            value: "supply_chain_planner_app"
          - name: LAKEBASE_OPERATIONAL_SCHEMA
            value: "public"
          - name: LAKEBASE_UC_CATALOG
            value: ${var.uc_catalog}

          # --- Unity Catalog (Genie + operational Delta source) ---
          - name: UC_CATALOG
            value: ${var.uc_catalog}
          - name: UC_SCHEMA
            value: ${var.uc_schema}
          - name: GENIE_SPACE_ID
            # Resolved from the `genie-space` app resource (below), same idiom as MLFLOW_EXPERIMENT_ID.
            # A bare `value: ${var.genie_space_id}` deploys name-only/empty when the var is the sentinel,
            # which silently disabled the Analytics route; value_from a resource always injects the id.
            value_from: "genie-space"
          - name: DATABRICKS_EMBEDDING_ENDPOINT
            value: ${var.embedding_endpoint}

          # --- Knowledge (Vector Search) ---
          - name: VECTOR_SEARCH_ENDPOINT
            value: ${var.vector_search_endpoint}
          - name: VECTOR_SEARCH_INDEX
            value: ${var.uc_catalog}.${var.uc_schema}.knowledge_chunks_index

          # --- Inference ---
          - name: LLM_ROUTER_ENDPOINT
            value: ${var.llm_router_endpoint}
          - name: LLM_PLANNER_ENDPOINT
            value: ${var.llm_endpoint}

          - name: LOG_LEVEL
            value: ${var.log_level}

      # App-SP resource grants. The experiment (tracing telemetry) + the native `postgres` Lakebase
      # resource; the OTHER data surfaces (Genie/VS/UC reads) are OBO. The `postgres` resource makes
      # the Apps platform auto-register the App SP's Postgres role (role name == its client-id UUID)
      # and grant it CONNECT + CREATE on the database — so the SP can create + own its own schemas
      # (agent memory + write-back) at startup with NO manual role-registration or CREATE grant.
      # (It does NOT grant SELECT on the synced operational tables in `public`, which the platform
      # owns — that stays a manual superuser GRANT, done by the seed's grant_app_sp task.)
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: ${resources.experiments.planner_experiment_uc.id}
            permission: 'CAN_MANAGE'
        # SQL warehouse backing UC trace storage. Binding it grants the App SP CAN_USE on the
        # warehouse AND injects its id into the env (MLFLOW_TRACING_SQL_WAREHOUSE_ID, value_from
        # "trace-warehouse"). id = ${var.sql_warehouse_id}, which defaults to the bundle-created
        # `app_sql_warehouse` above (or a BYO id via --var).
        - name: trace-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: lakebase
          postgres:
            branch: projects/${var.lakebase_project}/branches/${var.lakebase_branch}
            database: projects/${var.lakebase_project}/branches/${var.lakebase_branch}/databases/${var.lakebase_database_resource}
            permission: CAN_CONNECT_AND_CREATE
        # Genie (Analytics agent). Binds the bundle-created space (resources.genie_spaces above) by id,
        # so DABs creates the space first, then wires its id here in the same deploy. Binding does two
        # things: grants the App SP CAN_RUN on the space (the non-OBO/eval fallback) AND exposes the
        # space_id to the app env via `value_from: "genie-space"` above. End-user queries run OBO
        # (scope dashboards.genie), so the user — not the SP — is what UC governs at query time.
        - name: genie-space
          genie_space:
            # The genie_spaces resource exposes its created id as `.id` (NOT `.space_id`) in CLI
            # 1.3.0 — same as experiments/jobs/sql_warehouses. The direct engine creates the space
            # first, then resolves this id into the app's GENIE_SPACE_ID env in the same deploy.
            name: ${var.genie_space_name}
            space_id: ${resources.genie_spaces.supply_chain_analytics.id}
            permission: CAN_RUN

  # Setup-and-seed job — loads the demo dataset. Run it for demo samples; skip it to bring your
  # own data. Two independent chains after the schema bootstrap: operational (Lakebase) + knowledge
  # (Vector Search). Serverless Python tasks over the data/ scripts; notebooks where the file
  # carries the `# Databricks notebook source` header.
  jobs:
    setup_and_seed:
      name: "supply-chain-planner-setup-and-seed"
      tasks:
        # Idempotent: create the operational schema + the MLflow trace schema (+ volume) up front.
        # Serverless tasks can't take env vars, and they're exec'd without __file__/sys.path set —
        # so PYTHON tasks run through data/_seed_task.py, which fixes sys.path and applies the
        # config JSON (&seed_cfg) to os.environ before running the real script. NOTEBOOK tasks get
        # the same config as job widgets (&seed_widgets), read by config._job_param_overrides().
        - task_key: bootstrap_schemas
          spark_python_task:
            python_file: ./data/_seed_task.py
            parameters:
              - data/00_bootstrap_schemas.py
              - &seed_cfg '{"UC_CATALOG":"${var.uc_catalog}","UC_SCHEMA":"${var.uc_schema}","UC_VOLUME":"documents","LAKEBASE_AUTOSCALING_PROJECT":"${var.lakebase_project}","LAKEBASE_AUTOSCALING_BRANCH":"${var.lakebase_branch}","LAKEBASE_AUTOSCALING_ENDPOINT":"${var.lakebase_endpoint}","LAKEBASE_DATABASE":"${var.lakebase_database}","LAKEBASE_OPERATIONAL_SCHEMA":"public","LAKEBASE_UC_CATALOG":"${var.uc_catalog}","DATABRICKS_EMBEDDING_ENDPOINT":"${var.embedding_endpoint}","VECTOR_SEARCH_ENDPOINT":"${var.vector_search_endpoint}","MLFLOW_TRACE_CATALOG":"${var.uc_catalog}","MLFLOW_TRACE_SCHEMA":"${var.mlflow_trace_schema}","DATABRICKS_WAREHOUSE_ID":"${var.sql_warehouse_id}","APP_NAME":"${var.app_name}"}'
          environment_key: seed

        # --- Operational chain → Lakebase ---
        # These three are notebook-source files but use only get_spark()/spark.sql — no dbutils or
        # magics — so they run as launcher Python tasks like the rest (the notebook import-path
        # bootstrap can't find the bundle root on serverless; the launcher fixes sys.path + env).
        - task_key: create_operational_schema
          depends_on: [{ task_key: bootstrap_schemas }]
          spark_python_task:
            python_file: ./data/_seed_task.py
            parameters:
              - data/genie/01_create_operational_schema.py
              - *seed_cfg
          environment_key: seed
        - task_key: generate_operational_data
          depends_on: [{ task_key: create_operational_schema }]
          spark_python_task:
            python_file: ./data/_seed_task.py
            parameters:
              - data/operational/01_generate_genie_tables.py
              - *seed_cfg
          environment_key: seed
        - task_key: pre_seed_pgvector
          depends_on: [{ task_key: generate_operational_data }]
          spark_python_task:
            python_file: ./data/_seed_task.py
            parameters:
              - data/operational/02_pre_seed_pgvector.py
              - *seed_cfg
          environment_key: seed
        - task_key: sync_to_lakebase
          depends_on: [{ task_key: pre_seed_pgvector }]
          spark_python_task:
            python_file: ./data/_seed_task.py
            parameters:
              - data/operational/03_sync_to_lakebase.py
              - *seed_cfg
          environment_key: seed
        - task_key: verify_hybrid_query
          depends_on: [{ task_key: sync_to_lakebase }]
          spark_python_task:
            python_file: ./data/_seed_task.py
            parameters:
              - data/operational/04_verify_hybrid_query.py
              - *seed_cfg
          environment_key: seed
        # Grant the deployed App's service principal SELECT/USAGE on the operational (`public`)
        # synced tables — the one bit the `postgres` app resource can't cover (those tables are
        # owned by the platform, not the SP). The resource already handles role registration +
        # CONNECT + CREATE. Needs the synced tables to exist (→ sync_to_lakebase) and the app to be
        # deployed — make deploy deploys the app before the seed, so the SP exists.
        - task_key: grant_app_sp
          depends_on: [{ task_key: sync_to_lakebase }]
          spark_python_task:
            python_file: ./data/_seed_task.py
            parameters:
              - data/operational/05_grant_app_sp.py
              - *seed_cfg
          environment_key: seed
        # NOTE: the Genie space is no longer created here — it's a first-class DABs resource
        # (resources.genie_spaces.supply_chain_analytics), created + bound to the app on `bundle
        # deploy`. The operational tables it queries are still produced by generate_operational_data.

        # --- Knowledge chain → Vector Search (independent of the Lakebase chain) ---
        - task_key: upload_pdfs
          depends_on: [{ task_key: bootstrap_schemas }]
          spark_python_task:
            python_file: ./data/_seed_task.py
            parameters:
              - data/knowledge/01_upload_pdfs.py
              - *seed_cfg
          environment_key: seed
        - task_key: parse_and_chunk
          depends_on: [{ task_key: upload_pdfs }]
          spark_python_task:
            python_file: ./data/_seed_task.py
            parameters:
              - data/knowledge/02_parse_and_chunk.py
              - *seed_cfg
          environment_key: seed
        - task_key: build_vs_index
          depends_on: [{ task_key: parse_and_chunk }]
          spark_python_task:
            python_file: ./data/_seed_task.py
            parameters:
              - data/knowledge/03_build_vs_index.py
              - *seed_cfg
          environment_key: seed

      # Lean serverless environment. Only the packages the seed scripts actually import that
      # AREN'T already in the serverless base: psycopg (Lakebase, via _lakebase.py) and
      # pypdf + langchain-text-splitters (knowledge/02). Everything else they need —
      # databricks-sdk (Genie/VS/embeddings/synced-tables), pyspark, mlflow, pydantic — ships in
      # the serverless base, so requesting it here only risks version conflicts. (The original fat
      # list, esp. databricks-langchain[memory], made pip's resolver backtrack and fail to install.)
      environments:
        - environment_key: seed
          spec:
            client: "3"
            dependencies:
              - "psycopg[binary]"
              - "pypdf"
              - "langchain-text-splitters"
              # The serverless base SDK is too old for w.postgres (Lakebase autoscaling). Upgrade it
              # for the operational tasks (02/03/04). Small dep tree — unlike databricks-langchain,
              # it doesn't make the resolver backtrack.
              - "databricks-sdk>=0.81"

targets:
  # Personal iteration on YOUR workspace. mode:development prefixes resource names with your user.
  # Host comes from the --profile you pass (portable — no workspace hardcoded here).
  dev:
    mode: development
    default: true

  # Clean shared/demo deploy — fixed resource names, no user prefix.
  demo:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    resources:
      apps:
        supply_chain_planner:
          name: supply-chain-planner
