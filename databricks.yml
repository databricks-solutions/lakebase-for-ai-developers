# Databricks Asset Bundle (DABs) for the Supply-Chain Planner Copilot.
#
# SCAFFOLD ONLY — resources are intentionally left as empty placeholders. WS1 (Alex & Kylie)
# fills these in once Lakebase / the MLflow experiment are provisioned. Use the reference
# template's databricks.yml as the source of truth for the App resource shape, env wiring, and
# resource permissions:
#   https://github.com/databricks/app-templates/blob/main/agent-langgraph-advanced/databricks.yml
#
# Carve-out: the Genie space is NOT a clean DABs resource — create it manually (Genie Code /
# isaac + skills) and reference it as an app resource once it exists.
#
# Deploy (always pass the workspace profile):
#   databricks bundle validate --profile <profile>
#   databricks bundle deploy   --profile <profile> -t dev
#   databricks bundle run supply_chain_planner --profile <profile>

bundle:
  name: supply_chain_planner

resources:
