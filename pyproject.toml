[project]
name = "supply-chain-planner"
version = "0.1.0"
description = "Multi-agent supply-chain planner copilot — LangGraph on Databricks Apps, Lakebase state, MLflow tracing"
readme = "README.md"
# Capped below 3.13: the dev-only databricks-connect (16.x) pins numpy<2, and numpy<2 has no
# cpython-3.13+ wheels (numpy added 3.13 support in 2.1), so uv's universal resolver fails on
# the 3.13 split. DBR 16.x runs Python 3.12. Raise the cap once databricks-connect allows numpy>=2.
requires-python = ">=3.11,<3.13"

# Environment contract. Deps mirror the reference template's pinned set
# (https://github.com/databricks/app-templates/blob/main/agent-langgraph-advanced/pyproject.toml)
# plus the data/pgvector deps for the operational data layer.
dependencies = [
    # --- App / server (from the template) ---
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "python-dotenv>=1.2.1",
    # --- Agent / LangGraph + Databricks (from the template) ---
    "databricks-langchain[memory]>=0.19.0",
    "databricks-ai-bridge[agent-server]>=0.21.0",
    "databricks-sdk>=0.106.0",  # 0.106 exposes w.genie.create_space (programmatic Genie spaces)
    "databricks-agents>=1.9.3",
    "mlflow>=3.11",  # >=3.11 for UnityCatalog trace_location (UC-backed GenAI tracing)
    "langgraph>=1.1.0",
    "langchain-mcp-adapters>=0.2.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    # --- Lakebase / pgvector ---
    "psycopg[binary,pool]>=3.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "pgvector>=0.3.0",
    # --- Synthetic data gen ---
    "dbldatagen>=0.4.0",
    "faker>=30.0.0",
    # --- Knowledge agent: PDF parsing + chunking + VS client ---
    "pypdf>=5.0.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    # Cap <0.74: 0.74 moved VectorSearchIndex out of databricks.vector_search.client, which
    # databricks-openai (pulled by databricks-langchain[memory]) still imports from there →
    # ImportError at `import databricks_langchain`. See databricks/databricks-ai-bridge#433.
    "databricks-vectorsearch>=0.50,<0.74",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The app wheel ships `agent_server` only. The `data/` package is dev/setup tooling (Spark
# data-gen run as jobs) and must NOT land in the app wheel — `databricks-connect` conflicts with
# the Databricks runtime pyspark (see the dev group below).
[tool.hatch.build.targets.wheel]
packages = ["agent_server"]

[project.scripts]
# `start-server` runs the agent server (FastAPI + run/poll/resume + chat proxy; serves the built
# SPA at /ui). `start-app` is a convenience alias for it, kept because the vendored skills call
# `uv run start-app`. For live frontend dev use `npm --prefix frontend run dev` (Vite).
start-server = "agent_server.start_server:main"
start-app = "agent_server.start_server:main"
# Dispatches: bare → evaluate_direct (legacy), --harness → evaluate (legacy), --layer/--fast/--full
# → the eval flywheel (graph|server layer, quality + trace-shape scorers, baseline diff).
agent-evaluate = "agent_server.evaluation.cli:main"

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6.0",
    # Local Spark via Databricks Connect (get_spark() in data/_spark.py). DEV-ONLY: never install
    # on Databricks — it conflicts with the runtime pyspark. Databricks Connect must match your
    # workspace DBR major.minor — change this floor/cap to YOUR DBR (e.g. "==15.4.*" for DBR 15.4).
    "databricks-connect>=16.1,<17",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
# .claude/skills/ is vendored, pinned skill content (see .claude/skills/UPSTREAM.md) — not this
# repo's code, so it isn't linted here.
extend-exclude = [".claude/skills"]

[tool.ruff.lint.per-file-ignores]
# These scripts run standalone (as notebooks/jobs) and need `sys.path.insert(...)` before
# importing repo packages — the resulting E402 is intentional, not an ordering mistake.
"data/**/*.py" = ["E402"]

[tool.pytest.ini_options]
# Integration tests (tests/integration/) talk to a live Lakebase + the agent server and are
# SKIPPED by default — tests/conftest.py auto-skips them unless RUN_INTEGRATION=1 and Lakebase
# coords are configured. Everything else is offline.
markers = [
    "integration: requires a live Lakebase (skipped by default)",
]
